<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Cifras</title>
<meta name="description" content="Suas cifras e repertórios, mesmo sem internet.">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cifras">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#eeece6; --text:#1d1c1a; --muted:#6e6a63; --line:#e3e0d8;
  --accent:#c2410c; --accent-ink:#ffffff; --chord:#c2410c; --sec:#4f46e5; --danger:#b42318;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#111113; --surface:#1a1a1d; --surface2:#26262b; --text:#ecebe7; --muted:#9b978f; --line:#2e2e34;
  --accent:#fb923c; --accent-ink:#1a1006; --chord:#fdba74; --sec:#a5b4fc; --danger:#f87171;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#111113; --surface:#1a1a1d; --surface2:#26262b; --text:#ecebe7; --muted:#9b978f; --line:#2e2e34;
    --accent:#fb923c; --accent-ink:#1a1006; --chord:#fdba74; --sec:#a5b4fc; --danger:#f87171;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
body.full{padding-bottom:env(safe-area-inset-bottom)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:inherit}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.mt{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}

/* ---------- barra superior ---------- */
#bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  #bar{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px)}
}
.bar-in{display:flex;align-items:center;gap:2px;height:54px;padding:0 6px;max-width:980px;margin:0 auto}
.bar-title{flex:1;min-width:0;padding:0 8px}
.bar-title h1{font-size:18px;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;letter-spacing:-.01em}
.bar-title small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--text);text-decoration:none;flex:none}
.ib:active{background:var(--surface2)}
.ib.sm{width:38px;height:38px}
.ib.danger{color:var(--danger)}
.ib.bordered{border:1px solid var(--line);background:var(--surface)}
@media (hover:hover){.ib:not(:disabled):hover{background:var(--surface2)}}
#net{display:none;text-align:center;font-size:13px;font-weight:600;padding:5px 12px;background:var(--surface2);color:var(--muted)}
body.offline #net{display:block}

/* ---------- abas ---------- */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs a{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:12px;color:var(--muted);text-decoration:none;font-weight:650}
#tabs a.on{color:var(--accent)}
body.full #tabs{display:none}

main{max-width:980px;margin:0 auto;padding:14px 16px 28px}

/* ---------- listas ---------- */
.h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 8px;font-weight:750}
.h2:first-child{margin-top:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-height:62px;width:100%;text-align:left}
a.item:active,button.item:active{background:var(--surface2)}
.item .meta{flex:1;min-width:0}
.item .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s em{font-style:normal;color:var(--accent);font-weight:700}
.item > .i{color:var(--muted)}
.item.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.num{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:13px;font-weight:750;color:var(--muted);flex:none}
.date{width:46px;flex:none;text-align:center;line-height:1.05;display:flex;flex-direction:column;align-items:center}
.date span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.04em}
.date b{font-size:22px;font-weight:800}
.badge{font:750 13px/1 var(--mono);padding:7px 8px;border-radius:8px;background:color-mix(in srgb,var(--chord) 14%,transparent);color:var(--chord);white-space:nowrap;flex:none}
.ord{display:flex;gap:2px;flex:none}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px}
.btn .i{width:20px;height:20px}

/* ---------- vazio / dicas ---------- */
.empty{text-align:center;padding:36px 16px 20px;color:var(--muted)}
.empty .i{width:44px;height:44px;stroke-width:1.5;color:var(--accent);opacity:.8}
.empty h3{color:var(--text);margin:10px 0 4px;font-size:18px}
.empty p{margin:0 auto 16px;max-width:360px}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.hint b{display:block;margin-bottom:4px}
.hint ol{margin:6px 0 10px;padding-left:20px}
.hint li{margin:3px 0}
.card.bm ol{margin:6px 0 12px;padding-left:20px}
.card.bm li{margin:4px 0}

/* ---------- busca e filtros ---------- */
.search{position:relative;margin-bottom:10px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{padding-left:40px!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:650;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:13px;font-weight:750;color:var(--muted)}
input[type=text],input[type=search],input[type=date],select,textarea{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.code{font-family:var(--mono);line-height:1.4;min-height:52vh;white-space:pre;overflow-wrap:normal;overflow-x:auto;resize:vertical}
.grid3{display:grid;grid-template-columns:1.25fr 1fr .85fr;gap:10px}
.help{font-size:13.5px;color:var(--muted);margin:2px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:650;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row > div:first-child{min-width:0}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .val{min-width:96px;text-align:center;font-weight:750}

/* ---------- tela da cifra ---------- */
.tools{max-width:980px;margin:0 auto;padding:0 6px 9px;display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{height:38px;min-width:40px;padding:0 10px;border-radius:11px;border:0;background:var(--surface2);font-weight:750;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex:none;color:var(--text)}
.tb:active{filter:brightness(.92)}
.tb small{font-size:11.5px;font-weight:650;color:var(--muted)}
.tb.key{background:color-mix(in srgb,var(--chord) 16%,transparent);color:var(--chord);padding:0 11px}
.tb.key small{color:inherit;opacity:.8}
.tb.key b{color:var(--chord);font-size:17px;font-weight:800}
.tb.key .kc{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.tb.key .kc small{font-size:10px}
.tb.on{background:var(--text);color:var(--bg)}
.tb .i{width:18px;height:18px}
.grp{display:flex;flex:none;background:var(--surface2);border-radius:11px}
.grp .tb{background:transparent;min-width:38px;padding:0 8px}
.grp .tb + .tb{border-left:1px solid var(--line);border-radius:0 11px 11px 0}
.grp .tb:first-child{border-radius:11px 0 0 11px}
.a-sm{font-size:12px;font-weight:800}
.a-lg{font-size:18px;font-weight:800}
#bar.song .bar-title{opacity:0;transition:opacity .18s}
#bar.song.scrolled .bar-title{opacity:1}

/* cabeçalho da música */
.song-hero{font-family:var(--sans);padding:8px 0 16px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.song-hero h2{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.song-hero p{margin:4px 0 0;color:var(--muted);font-size:15.5px;font-weight:500}
.song-hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchip{font:600 13.5px/1 var(--sans);padding:8px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);border:0;display:inline-flex;align-items:center;gap:4px}
.hchip b{color:var(--chord);font-weight:800}
.hchip.key{background:color-mix(in srgb,var(--chord) 16%,transparent);color:var(--chord)}
button.hchip{cursor:pointer}

.cifra{--fs:17px;font-family:var(--mono);font-size:var(--fs);line-height:1.35;padding:4px 0 45vh}
.cifra.lyr-only{font-family:var(--sans);line-height:1.5}
.cifra .blk{margin:0 0 1.15em;break-inside:avoid}
.cifra .ln{min-height:1.35em}
.cifra .lyr{white-space:pre-wrap}
.cifra .co{white-space:pre-wrap}
.cifra .c{color:var(--chord);font-weight:750}
.cifra .lbl,.cifra .sec{color:var(--sec);font-weight:750}
.cifra .sec{margin-bottom:.15em}
.cifra .pr{margin-bottom:.1em}
.cifra .w{display:inline-block;white-space:nowrap;vertical-align:bottom}
.cifra .k{display:inline-block;vertical-align:bottom}
.cifra .cd{display:block;min-height:1.35em;padding-right:.5ch;white-space:pre;color:var(--chord);font-weight:750}
.cifra .kt{display:block;white-space:pre;min-height:1.35em}
.cifra .tabblk{white-space:pre;overflow-x:auto;font-size:.82em;margin:0 0 .6em;padding:8px 10px;background:var(--surface2);border-radius:10px}
/* estilo moderno: letra em fonte comum, acordes por cima, partes como etiquetas, refrão destacado */
.cifra.modern{font-family:var(--sans);line-height:1.38}
.cifra.modern .blk{margin:0 0 1.5em}
.cifra.modern .pr{margin-bottom:.5em}
.cifra.modern .cd{font-size:.86em;font-weight:800;letter-spacing:.01em;min-height:1.35em;padding-right:.45em}
.cifra.modern .kt{min-height:1.38em}
.cifra.modern .lyr{margin-bottom:.35em}
.cifra .sec .tag,.cifra .co.m .tag{display:inline-block;font:800 max(11px,.66em)/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--sec);background:color-mix(in srgb,var(--sec) 15%,transparent);padding:.5em .75em;border-radius:999px}
.cifra.modern .sec{margin-bottom:.75em}
.cifra .co.m{display:flex;flex-wrap:wrap;align-items:center;gap:.3em 1.1em;margin-bottom:.4em}
.cifra .co.m .c{font-size:.95em;font-weight:800}
.cifra .co.m .f{color:var(--muted)}
.cifra.modern .chorus{background:color-mix(in srgb,var(--accent) 7%,transparent);border-left:3px solid var(--accent);border-radius:4px 14px 14px 4px;padding:.8em .9em .35em;margin-left:-6px}
.cifra.modern .chorus .sec .tag{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.cifra.modern .tabblk{font-family:var(--mono);font-size:.78em;line-height:1.35;border:1px solid var(--line)}
.cifra.modern.lyr-only .lyr{margin-bottom:.15em}
@media (min-width:900px){.cifra.cols{columns:2;column-gap:56px}}

.setnav{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.setnav .btn{min-width:56px;padding:0 12px}
.setnav .mid{flex:1;text-align:center;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.25}
.setnav .mid b{display:block;color:var(--text);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#scrollctl{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:26;display:flex;align-items:center;gap:2px;background:var(--text);color:var(--bg);border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.hasnav #scrollctl{bottom:calc(82px + env(safe-area-inset-bottom))}
#scrollctl button{width:42px;height:42px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center}
#scrollctl span{min-width:30px;text-align:center;font-weight:800;font-size:15px}

/* ---------- folhas (modais) ---------- */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .15s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out;overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 14px;font-size:19px}
.sheet .h3{font-weight:750;margin:20px 0 8px}
.sheet p{margin:8px 0}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);border-radius:20px;padding:18px 22px 22px;animation:fade .15s ease-out}
  .sheet::before{display:none}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border:0;background:transparent;text-align:left;font-weight:600;border-radius:10px}
.mi:active{background:var(--surface2)}
.mi.danger{color:var(--danger)}
.mi .i{color:var(--muted)}
.mi.danger .i{color:var(--danger)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font:750 17px var(--mono);position:relative;padding:0}
.keys button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.keys button.orig::after{content:"original";position:absolute;bottom:3px;left:0;right:0;font:650 9.5px var(--sans);opacity:.75}
.pick{max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.pickrow .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.pickrow.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pickrow .chk .i{width:16px;height:16px;stroke-width:3}
.pickrow .in{font-size:12px;color:var(--muted);font-weight:650}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 4px;margin-top:8px}

#upd{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:45;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:650;transition:.2s;z-index:70;pointer-events:none;max-width:min(92vw,460px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header id="bar"></header>
<main id="app"></main>
<nav id="tabs">
  <a href="#/" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Repertórios</a>
  <a href="#/songs" data-tab="songs"><svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Músicas</a>
  <a href="#/settings" data-tab="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Ajustes</a>
</nav>
<div id="scrollctl" hidden></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<noscript><p style="padding:20px">Ative o JavaScript para usar o app de cifras.</p></noscript>

<script>
'use strict';
const VERSION = '1.2.0';

/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');

// Junta dados de outro aparelho/arquivo: o mais recente vence

  let added = 0, updated = 0;
  const tomb = Object.assign({}, db.deleted);
  for (const [id, t] of Object.entries(data.deleted || {})) if (ID_RE.test(id) && +t && (!tomb[id] || tomb[id] < +t)) tomb[id] = +t;
  for (const [kind, clean] of [['songs', cleanSong], ['setlists', cleanSet]]) {
    for (const raw of (Array.isArray(data[kind]) ? data[kind] : [])) {
      const inc = clean(raw); if (!inc) continue;
      if (tomb[inc.id] && tomb[inc.id] >= inc.updatedAt) continue;
      const i = db[kind].findIndex(x => x.id === inc.id);
      if (i < 0) { db[kind].push(inc); added++; }
      else if (inc.updatedAt > db[kind][i].updatedAt) { db[kind][i] = inc; updated++; }
    }
    db[kind] = db[kind].filter(x => !(tomb[x.id] && tomb[x.id] >= x.updatedAt));

function b64url(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

}

function ccGrab(APP) {
  if (location.href.indexOf(APP) === 0) { alert('Arraste este botão para a barra de favoritos. Depois use-o na página de uma música no Cifra Club.'); return; }
  var pres = [].slice.call(document.querySelectorAll('pre')).sort(function (a, b) { return b.textContent.length - a.textContent.length; });
  var pre = pres[0];
  if (!pre || pre.textContent.replace(/\s/g, '').length < 10) { alert('Não achei uma cifra nesta página. Abra a música no Cifra Club e tente de novo.'); return; }
  var one = function (s) { return String(s || '').replace(/[\u200b-\u200d\u2060\ufeff]/g, '').replace(/\s+/g, ' ').trim(); };
  var text = pre.textContent.replace(/[\u200b-\u200d\u2060\ufeff]/g, '').replace(/\u00a0/g, ' ');
  var page = document.body.innerText || document.body.textContent || '';
  var tom = page.match(/Tom:\s*[A-G][#b]?m?(\s*\(forma dos acordes no tom de\s*[A-G][#b]?m?\))?/i);
  var capo = page.match(/capotraste\s+na\s+\d+\S*\s*casa/i);
  if (!capo) { var cb = document.getElementById('capo'), cm = cb && cb.textContent.match(/(\d+)\s*ª/); if (cm) capo = ['Capotraste na ' + cm[1] + 'ª casa']; }
  var parts = document.title.split(' - ');

  var seg = location.pathname.split('/')[1];
  var art = seg && (document.querySelector('a[href="/' + seg + '/"] h2') || document.querySelector('a[href="/' + seg + '/"]'));
  var h1 = document.querySelector('h1');
  var title = one(h1 && h1.textContent) || (parts.length > 1 ? parts.slice(0, -1).join(' - ') : parts[0]);
  var artist = one(art && art.textContent) || (parts.length > 1 ? parts[parts.length - 1] : '');
  var head = (tom ? one(tom[0]) + '\n' : '') + (capo ? one(capo[0]) + '\n' : '');
  var json = JSON.stringify({app: 'cifras', type: 'song', title: title, artist: artist, text: head + (head ? '\n' : '') + text});
  var code = 'j' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

}

// ---------- rolagem automática ----------
let scrolling = false, raf = 0, lastT = 0, acc = 0, holdUntil = 0;
function startScroll() { if (scrolling) return; scrolling = true; lastT = 0; acc = 0; raf = requestAnimationFrame(tick); drawScrollCtl(); drawTools(); }
function stopScroll() { if (!scrolling) return; scrolling = false; cancelAnimationFrame(raf); drawScrollCtl(); drawTools(); }
function tick(t) {
  if (!scrolling) return;
  if (lastT && t > holdUntil) {
    acc += Math.min(250, t - lastT) / 1000 * SPEEDS[db.settings.speed];
    const px = Math.floor(acc);
    if (px > 0) { scrollBy(0, px); acc -= px; }
    if (scrollY + innerHeight >= document.documentElement.scrollHeight - 2) { stopScroll(); return; }
  }
  lastT = t; raf = requestAnimationFrame(tick);
}
function drawScrollCtl() {
  const el = $('#scrollctl');
  if (!scrolling) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<button data-act="spd" data-d="-1" aria-label="Mais devagar">${ic('minus')}</button><span aria-label="Velocidade">${db.settings.speed + 1}</span><button data-act="spd" data-d="1" aria-label="Mais rápido">${ic('plus')}</button><button data-act="scroll" aria-label="Parar rolagem">${ic('pause')}</button>`;
}
const hold = () => { holdUntil = performance.now() + 900; };
addEventListener('touchstart', () => { if (scrolling) holdUntil = Infinity; }, {passive:true});
addEventListener('touchend', () => { if (scrolling) hold(); }, {passive:true});
addEventListener('wheel', () => { if (scrolling) hold(); }, {passive:true});

// ---------- manter a tela ligada ----------
let wakeLock = null, wantWake = false;
async function keepAwake(on) {
  wantWake = on;
  try {
    if (on && 'wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake) keepAwake(true); });

let EDIT = null;
function drawPreview() {
  const txt = normalizeText($('#e-text').value);
  const fake = {key:$('#e-key').value || detectKey(cleanChars($('#e-text').value)), text:txt};
  $('#e-prev').classList.toggle('modern', modernStyle());
  $('#e-prev').innerHTML = txt ? renderCifra(txt, viewCtx(fake, 0, 0), false, modernStyle()) : '<p class="muted">Nada para mostrar ainda.</p>';
  $('#e-prev').style.setProperty('--fs', Math.min(db.settings.fontSize, 17) + 'px');
}
function saveSong() {
  const {song, isNew, setId, ret} = EDIT;
  const title = $('#e-title').value.trim();
  if (!title) { toast('Dê um nome para a música'); $('#e-title').focus(); return; }
  const raw = cleanChars($('#e-text').value), text = normalizeText(raw), now = Date.now();
  const key = $('#e-key').value || detectKey(raw);
  const capo = clampInt($('#e-capo').value, 0, 11);
  // cifra escrita em formas com capo: o tom que soa fica como transposição padrão
  const info = !$('#e-key').value && detectKeyInfo(raw);
  if (info && info.shift && capo) song.transpose = info.shift;
  Object.assign(song, {title, artist:$('#e-artist').value.trim(), instrument:$('#e-inst').value, key, capo, text, updatedAt:now});
  db.settings.lastInstrument = song.instrument;
  if (isNew) {
    song.createdAt = now; db.songs.push(song);
    const s = setId && setById(setId);
    if (s) { s.items.push({songId:song.id, transpose:song.transpose || 0, capo:song.capo}); s.updatedAt = now; }
  }
  persist(); EDIT = null; toast('Salvo');
  location.replace(isNew ? (setId ? '#/set/' + setId : '#/song/' + song.id) : ret);
}

/* =========================================================
   Tela: ajustes
   ========================================================= */
function viewSettings() {
  setTabs('settings');
  header({title:'Ajustes'});
  const st = db.settings;
  const seg = (act, cur, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
  let inst;
  if (isStandalone()) inst = '<p class="small" style="margin:0">✓ App instalado neste aparelho.</p>';
  else if (installEvt) inst = `<button class="btn primary sm" data-act="install">${ic('phone')} Instalar app</button>`;
  else if (isIOS()) inst = '<p class="small muted" style="margin:0">No Safari: toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.</p>';
  else inst = '<p class="small muted" style="margin:0">No Chrome: menu ⋮ → <b>Instalar app</b> (ou “Adicionar à tela inicial”). No computador, use o ícone de instalar na barra de endereço.</p>';
  const bm = bookmarkletCode();
  const bmCard = !isHttp() ? '' : `
    <div class="h2">Trazer cifras do Cifra Club</div>
    <div class="card bm">
      <p class="small muted" style="margin:0 0 6px">Com o favorito <b>Salvar no Minhas Cifras</b>, você abre a música no Cifra Club, toca nele e a cifra chega aqui já preenchida: nome, artista, tom e capo. É só conferir e salvar.</p>
      ${isIOS() ? '<p class="small" style="margin:8px 0">⚠️ No iPhone, a música trazida pelo favorito vai para o Minhas Cifras do Safari, não para o app instalado. No celular, prefira copiar e colar a cifra.</p>' : ''}
      <b class="small">No computador</b>
      <ol class="small"><li>Mostre a barra de favoritos: <b>Ctrl + Shift + B</b> (no Mac, <b>⌘ + Shift + B</b>).</li><li>Arraste o botão abaixo até a barra de favoritos.</li><li>Para usar: abra a música no Cifra Club e clique no favorito.</li></ol>
      <a class="btn primary sm" href="${esc(bm)}" data-act="bmClick" draggable="true" title="Arraste para a barra de favoritos">Salvar no Minhas Cifras</a>
      <b class="small" style="display:block;margin-top:18px">No celular Android (Chrome)</b>
      <ol class="small">
        <li>Toque em <b>Copiar código</b>, aqui embaixo.</li>
        <li>No menu <b>⋮</b> do Chrome, toque na estrela <b>☆</b> para salvar esta página nos favoritos.</li>
        <li>Menu <b>⋮</b> → <b>Favoritos</b>. No favorito novo, toque nos <b>três pontinhos</b> → <b>Editar</b>.</li>
        <li>Mude o nome para <b>cifra</b>. No campo do endereço (URL), apague tudo e cole o código. Salve.</li>
        <li>Para usar: abra a música no Cifra Club, toque na barra de endereço, digite <b>cifra</b> e toque no favorito que aparece (o com a estrela).</li>
      </ol>
      <button class="btn sm" data-act="copyBm">${ic('copy')} Copiar código</button>
    </div>`;
  $('#app').innerHTML = `${bmCard}
    <div class="h2">Aparência</div>
    <div class="card">
      <div class="field" style="margin-bottom:12px"><label>Tema</label>${seg('theme', st.theme, [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']])}</div>
      <div class="field" style="margin-bottom:4px"><label>Estilo da cifra</label>${seg('style', st.style === 'classic' ? 'classic' : 'modern', [['modern', 'Moderno'], ['classic', 'Clássico']])}</div>
      <p class="help" style="margin:0 2px 10px">Moderno: letra mais fácil de ler, partes da música em etiquetas e refrão destacado. Clássico: letra de máquina de escrever, igual aos sites de cifra.</p>
      <div class="set-row"><div><b>Tamanho da letra</b><div class="small muted">Também dá para mudar na tela da cifra.</div></div>
        <div class="stepper"><button class="ib bordered" data-act="setFs" data-d="-1" aria-label="Menor">${ic('minus')}</button><b style="min-width:30px;text-align:center">${st.fontSize}</b><button class="ib bordered" data-act="setFs" data-d="1" aria-label="Maior">${ic('plus')}</button></div></div>
    </div>
    <div class="h2">Acordes</div>
    <div class="card">
      <div class="field" style="margin-bottom:6px"><label>Escrita dos acidentes</label>${seg('accid', st.accidentals, [['auto', 'Automática'], ['sharp', 'Sempre ♯'], ['flat', 'Sempre ♭']])}</div>
      <p class="help">Automática escolhe sustenido ou bemol de acordo com o tom (ex.: em F aparece Bb; em E aparece A#).</p>
    </div>
    <div class="h2">Na hora de tocar</div>
    <div class="card">
      <div class="set-row"><div><b>Manter a tela ligada</b><div class="small muted">A tela não apaga enquanto a cifra está aberta.</div></div><label class="switch"><input type="checkbox" data-act="wake" ${st.wake ? 'checked' : ''}><span></span></label></div>
    </div>
    <div class="h2">Usar sem internet</div>
    <div class="card">
      <p class="small" id="offst" style="margin:0 0 10px">Verificando…</p>
      ${inst}
    </div>
    <div class="h2">Backup e outros aparelhos</div>
    <div class="card">
      <p class="small muted" style="margin:0 0 12px">As cifras ficam salvas só neste aparelho. Para levar do computador para o celular (ou fazer backup), salve um arquivo aqui e importe no outro. Também dá para mandar um repertório inteiro por link, no botão de enviar do repertório.</p>
      <div class="row"><button class="btn grow" data-act="exportAll">${ic('download')} Salvar backup</button><button class="btn grow" data-act="importFile">${ic('upload')} Importar arquivo</button></div>
    </div>
    <div class="h2">Dados</div>
    <div class="card">
      <p class="small muted" style="margin:0 0 12px">${plural(db.songs.length, 'música', 'músicas')} e ${plural(db.setlists.length, 'repertório', 'repertórios')} salvos neste aparelho.</p>
      <button class="btn danger sm" data-act="wipe">${ic('trash')} Apagar tudo</button>
    </div>
    <p class="center small muted" style="margin-top:24px">Minhas Cifras · versão ${VERSION}</p>`;
  offlineStatus().then(t => { const el = $('#offst'); if (el) el.innerHTML = t; });
}
async function offlineStatus() {
  if (!isHttp()) return 'Aberto direto do arquivo: funciona sem internet neste computador. Para o celular, use o endereço publicado.';
  if (!('serviceWorker' in navigator)) return 'Este navegador não permite o modo offline. Tente o Chrome ou o Safari.';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.active) return '✓ <b>Pronto para usar sem internet</b> neste aparelho.';
  } catch (e) {}
  return 'Preparando o modo offline… (abra o app uma vez com internet)';
}

/* =========================================================
   Ações (cliques)
   ========================================================= */
const ACT = {
  closeSheet:() => closeSheet(),
  newSet:() => setForm(),
  organize:() => { organizing = !organizing; rerender(); },
  mv:el => { const s = setById(el.dataset.id), i = +el.dataset.i, j = i + +el.dataset.d; if (!s || j < 0 || j >= s.items.length) return; [s.items[i], s.items[j]] = [s.items[j], s.items[i]]; s.updatedAt = Date.now(); persist(); rerender(); },
  rmItem:el => { const s = setById(el.dataset.id); if (!s) return; s.items.splice(+el.dataset.i, 1); s.updatedAt = Date.now(); persist(); rerender(); },
  addSongs:el => addSongsSheet(el.dataset.id),
  shareMenu:el => { const id = el.dataset.id; menuSheet('Enviar repertório', [
    {icon:'link', label:'Link com as cifras (abre no app de quem receber)', fn:() => shareSetLink(id)},
    {icon:'text', label:'Só a lista de músicas e tons (texto)', fn:() => shareSetList(id)},
    {icon:'download', label:'Salvar arquivo do repertório', fn:() => exportSet(id)},
  ]); },
  setMenu:el => { const s = setById(el.dataset.id); if (!s) return; menuSheet(s.name, [
    {icon:'edit', label:'Mudar nome ou data', fn:() => setForm(s)},
    {icon:'copy', label:'Duplicar repertório', fn:() => { const now = Date.now(), c = {...s, id:uid(), name:s.name + ' (cópia)', date:todayStr(), items:s.items.map(it => ({...it})), createdAt:now, updatedAt:now}; db.setlists.push(c); persist(); location.hash = '#/set/' + c.id; }},
    {icon:'trash', label:'Excluir repertório', danger:true, fn:async () => { if (await ask(`Excluir o repertório “${s.name}”? As músicas continuam salvas.`, 'Excluir', true)) { db.setlists = db.setlists.filter(x => x.id !== s.id); db.deleted[s.id] = Date.now(); persist(); location.replace('#/'); } }},
  ]); },
  filt:el => { songFilter = el.dataset.v; viewSongs(); },
  keySheet:() => keySheet(),
  tr:el => setTr((target().transpose || 0) + +el.dataset.d),
  fs:el => { db.settings.fontSize = clampInt(db.settings.fontSize + +el.dataset.d, 11, 40); persist(); drawSong(); },
  scroll:() => scrolling ? stopScroll() : startScroll(),
  spd:el => { db.settings.speed = clampInt(db.settings.speed + +el.dataset.d, 0, SPEEDS.length - 1); persist(); drawScrollCtl(); },
  lyrics:() => { db.settings.lyricsOnly = !db.settings.lyricsOnly; persist(); drawSong(); },
  songMenu:() => songMenu(),
  go:el => { if (!S || !S.set) return; const j = S.idx + +el.dataset.d; if (j >= 0 && j < S.set.items.length) location.replace(`#/play/${S.set.id}/${j}`); },
  saveSong:() => saveSong(),
  cancelEdit:async () => { if (EDIT && EDIT.dirty() && !await ask('Sair sem salvar as alterações?', 'Sair sem salvar', true)) return; const r = EDIT ? EDIT.ret : '#/'; EDIT = null; location.replace(r); },
  previewToggle:() => { const p = $('#e-prev'); p.hidden = !p.hidden; if (!p.hidden) { drawPreview(); p.scrollIntoView({behavior:'smooth', block:'start'}); } },
  delSong:async () => { const {song, ret} = EDIT; if (await ask(`Excluir “${song.title}”? Ela também sai dos repertórios. Não dá para desfazer.`, 'Excluir', true)) { deleteSong(song.id); EDIT = null; toast('Música excluída'); location.replace(/^#\/(song|play)\//.test(ret) ? '#/songs' : ret); } },
  theme:el => { db.settings.theme = el.dataset.v; persist(); applyTheme(); viewSettings(); },
  accid:el => { db.settings.accidentals = el.dataset.v; persist(); viewSettings(); },
  style:el => { db.settings.style = el.dataset.v; persist(); viewSettings(); },
  setFs:el => { db.settings.fontSize = clampInt(db.settings.fontSize + +el.dataset.d, 11, 40); persist(); viewSettings(); },
  bmClick:() => toast('Arraste este botão até a barra de favoritos (não precisa clicar).'),
  copyBm:async () => {
    const code = bookmarkletCode();
    try { await navigator.clipboard.writeText(code); toast('Código copiado! Agora crie o favorito no Chrome.'); }
    catch (e) {
      const sh = openSheet(`<h3>Código do favorito</h3><p class="muted small">Copie todo o texto abaixo:</p><textarea class="code" style="min-height:30vh;white-space:pre-wrap;word-break:break-all" readonly>${esc(code)}</textarea><div class="row end mt"><button class="btn primary" data-act="closeSheet">Fechar</button></div>`);
      const ta = sh.querySelector('textarea'); ta.focus(); ta.select();
    }
  },
  exportAll:() => exportAll(),
  importFile:() => $('#imp').click(),
  install:async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; rerender(); },
  dismissHint:() => { db.settings.hintDismissed = true; persist(); rerender(); },
  wipe:async () => {
    if (!await ask('Apagar TODAS as músicas e repertórios deste aparelho? Faça um backup antes. Não dá para desfazer.', 'Apagar tudo', true)) return;
    const now = Date.now(); db.songs.concat(db.setlists).forEach(x => { db.deleted[x.id] = now; });
    db.songs = []; db.setlists = []; persist(); toast('Tudo apagado'); location.hash = '#/';
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.type === 'checkbox') return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-act=wake]')) { db.settings.wake = el.checked; persist(); }
  if (el.id === 'imp' && el.files && el.files[0]) {
    const f = el.files[0]; el.value = '';
    f.text().then(t => { const r = importData(JSON.parse(t)); toast(`Importado: ${plural(r.added, 'item novo', 'itens novos')}, ${plural(r.updated, 'atualizado', 'atualizados')}`); rerender(); })
      .catch(() => toast('Esse arquivo não é um backup de cifras válido.'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet-root').classList.contains('open')) { closeSheet(); return; }
  if (e.target.matches('input,textarea,select') || $('#sheet-root').classList.contains('open') || !S || !S.set) return;
  if (e.key === 'ArrowRight') { ACT.go({dataset:{d:1}}); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { ACT.go({dataset:{d:-1}}); e.preventDefault(); }
});

/* =========================================================
   Tema, internet, instalação, início
   ========================================================= */
function applyTheme() {
  const t = db.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  requestAnimationFrame(() => { $('meta[name=theme-color]').content = getComputedStyle(document.body).backgroundColor; });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
const updNet = () => document.body.classList.toggle('offline', !navigator.onLine);
addEventListener('online', updNet); addEventListener('offline', updNet);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (/^#\/(settings)?$/.test(location.hash || '#/') && !$('#sheet-root').classList.contains('open')) rerender(); });
addEventListener('appinstalled', () => { installEvt = null; toast('App instalado! Agora abre direto da tela inicial.'); });
addEventListener('storage', e => { if (e.key === STORE_KEY && !EDIT) { db = load(); rerender(); } });
addEventListener('hashchange', () => { organizing = false; scrollTo(0, 0); route(); });

try { if (!localStorage.getItem(STORE_KEY)) persist(); } catch (e) {}
applyTheme(); updNet(); route();
if ('serviceWorker' in navigator && isHttp()) {
  // quando uma versão nova do app é baixada, oferece atualizar (sem interromper quem está editando)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || $('#upd')) return;
    const b = document.createElement('button');
    b.id = 'upd'; b.className = 'btn primary sm'; b.textContent = 'Nova versão do app pronta · Atualizar';
    b.onclick = () => { if (EDIT && EDIT.dirty()) { toast('Salve a música antes de atualizar.'); return; } location.reload(); };
    document.body.appendChild(b);
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)));
}
</script>
</body>
</html>
